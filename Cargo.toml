[package]
name = "provenanced"
version = "0.1.0"
edition = "2021"
description = "filesystem provenance with xattrs"
license = "GPL-3.0-or-later"

[[bin]]
name = "provenanced"
path = "src/bin/daemon.rs"

[[bin]]
name = "provenance"
path = "src/bin/query.rs"

[dependencies]
libc = "0.2"
xattr = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
